# ---------------------------------------------------------------------------
# APK bauen
#
#   push auf main         -> Debug-APK (installierbar, zum Ausprobieren)
#   pull_request auf main -> Lint + Unit-Tests + Debug-APK
#   push eines Tags v*    -> signierte Release-APK + GitHub Release
#   manueller Start       -> APK mit selbst eingetippten Angaben
#
# Ohne eingetragene Angaben gelten die Werte aus apkcreator.json.
# ---------------------------------------------------------------------------
name: APK bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Name der App (leer = Wert aus apkcreator.json)"
        required: false
        type: string
      package_id:
        description: "Paket-ID, z. B. de.meinefirma.meineapp (leer = apkcreator.json)"
        required: false
        type: string
      version_name:
        description: "Version, z. B. 1.0.0 (leer = apkcreator.json)"
        required: false
        type: string
      build_type:
        description: "Welche Variante gebaut werden soll"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

# Standardmaessig nur Lesezugriff. Schreibrechte bekommt ausschliesslich
# der Release-Job, und zwar nur auf "contents" (fuer das Anlegen des Releases).
permissions:
  contents: read

# Pro Branch/Tag laeuft immer nur ein Build. Aeltere Laeufe desselben Refs
# werden abgebrochen - ausser bei Tags: ein angefangenes Release soll nicht
# unterwegs abgeschossen werden.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # AGP 8.7.3 setzt JDK 17 voraus, und das jvmTarget der Module ist ebenfalls 17.
  JAVA_VERSION: "17"
  # Ohne UTF-8-Locale liest die JVM Umgebungsvariablen als ASCII - ein
  # App-Name wie "Grüße", der beim manuellen Start eingetippt wird, kaeme
  # dann verstuemmelt in der APK an.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # =========================================================================
  # APK BAUEN: laeuft bei Push, Pull Request und manuellem Start.
  # Bei Tags wird dieser Job uebersprungen - dort greift der Release-Job.
  # =========================================================================
  build:
    name: APK bauen
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Uebernimmt das Caching von Gradle-Dependencies und Build-Cache.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x ./gradlew

      # Lint und Unit-Tests laufen nur im Pull Request. Ein Fehler bricht den
      # Job ab, damit kaputter Code nicht nach main gelangt.
      - name: Lint ausfuehren
        if: github.event_name == 'pull_request'
        run: ./gradlew lintDebug --stacktrace

      - name: Unit-Tests ausfuehren
        if: github.event_name == 'pull_request'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Test- und Lint-Reports sichern
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          retention-days: 30
          if-no-files-found: ignore

      # Beim manuellen Start entscheidet die Auswahl, sonst wird Debug gebaut.
      - name: Zu bauende Variante bestimmen
        id: variant
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
          if [ "${BUILD_TYPE}" = "release" ]; then
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          fi

      # Der Keystore wird nur entschluesselt, wenn eine Release-Variante
      # gewuenscht ist UND das Secret existiert. Fehlt es, baut Gradle bewusst
      # mit der Debug-Signatur weiter, statt abzubrechen.
      - name: Keystore bereitstellen (nur Release)
        id: keystore
        if: steps.variant.outputs.type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::Kein KEYSTORE_BASE64 hinterlegt - die APK wird mit der Debug-Signatur gebaut."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          chmod 600 "${RUNNER_TEMP}/release.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Keystore geschrieben ($(stat -c%s "${RUNNER_TEMP}/release.jks") Bytes)."

      - name: APK bauen
        env:
          # Leere Werte werden von Gradle ignoriert - dann gilt apkcreator.json.
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          # Fortlaufender versionCode, damit sich zwei Builds auf einem Geraet
          # nicht gegenseitig blockieren.
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.available == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.available == 'true' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ steps.keystore.outputs.available == 'true' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.available == 'true' && secrets.KEY_PASSWORD || '' }}
        run: ./gradlew ${{ steps.variant.outputs.task }} --stacktrace

      - name: Keystore wieder loeschen
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      # Branchname und Commit-SHA in den Artefaktnamen. Schraegstriche aus
      # Branchnamen (feature/xyz) sind in Artefaktnamen nicht erlaubt.
      - name: Artefaktnamen bestimmen
        id: meta
        run: |
          echo "ref_slug=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.variant.outputs.type }}-${{ steps.meta.outputs.ref_slug }}-${{ steps.meta.outputs.sha_short }}
          path: app/build/outputs/apk/${{ steps.variant.outputs.dir }}/*.apk
          retention-days: 30
          if-no-files-found: error

  # =========================================================================
  # RELEASE: laeuft ausschliesslich bei einem Tag nach Muster v*.
  # Baut signiert, haengt die APK an ein GitHub Release und erzeugt die
  # Release Notes aus den Commits seit dem vorherigen Tag.
  # =========================================================================
  release:
    name: Signierte Release-APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Schreibrecht nur hier, damit das Release angelegt werden kann.
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x ./gradlew

      # Der Keystore liegt als Base64 im Secret und wird in RUNNER_TEMP
      # geschrieben - also ausserhalb des Workspace, damit er nie versehentlich
      # in ein Artefakt oder einen Commit geraet.
      # base64 schreibt direkt in die Datei; der Inhalt taucht nie im Log auf.
      - name: Keystore aus Secret entschluesseln
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 ist nicht gesetzt. Anleitung: docs/CI.md"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          chmod 600 "${RUNNER_TEMP}/release.jks"
          # Nur die Dateigroesse zur Kontrolle - kein Inhalt, kein Passwort.
          echo "Keystore geschrieben ($(stat -c%s "${RUNNER_TEMP}/release.jks") Bytes)."

      # Versionsangaben aus dem Tag ableiten: v1.2.3 -> versionName 1.2.3.
      - name: Versionsangaben aus dem Tag ableiten
        id: version
        run: |
          set -euo pipefail
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Release-APK bauen und signieren
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease --stacktrace

      # Sicherheitsnetz: schlaegt fehl, wenn die APK versehentlich mit dem
      # Android-Debug-Zertifikat signiert wurde (z. B. falsches Secret).
      - name: Signatur pruefen
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          BUILD_TOOLS=$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          CERTS=$("${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}")
          echo "${CERTS}"
          if echo "${CERTS}" | grep -q "CN=Android Debug"; then
            echo "::error::APK wurde mit der Debug-Signatur gebaut - Keystore-Secrets pruefen."
            exit 1
          fi

      # Release Notes aus allen Commits seit dem vorherigen Tag.
      - name: Release Notes erzeugen
        id: changelog
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Aenderungen"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "Seit \`${PREV_TAG}\`:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${GITHUB_REF_NAME}"
            else
              echo "Erstes Release - alle Commits:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo
            echo
            echo "---"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
          } > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Release-APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.ref_name }}-${{ steps.version.outputs.sha_short }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      # Das R8-Mapping wird zum Entschluesseln von Crash-Stacktraces gebraucht.
      # Ohne diese Datei sind Absturzberichte aus dem Release unlesbar.
      - name: R8-Mapping sichern
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: GitHub Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Laeuft immer, auch wenn der Build vorher abgebrochen ist: der
      # entschluesselte Keystore darf den Runner nicht ueberleben.
      - name: Keystore wieder loeschen
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
