# JVM-Einstellungen fuer den Gradle-Daemon.
# 3 GB Heap passen sowohl auf Entwicklerrechner als auch auf GitHub-hosted Runner
# (ubuntu-latest hat 16 GB RAM); MaxMetaspaceSize begrenzt den Kotlin-Compiler.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX statt der alten Support-Library.
android.useAndroidX=true
# Jedes Modul bekommt seine eigene R-Klasse -> kleinere Builds, schnellere Inkremente.
android.nonTransitiveRClass=true

kotlin.code.style=official
